<!DOCTYPE html>
<html>
<head><style>
  body { font-family: system-ui; padding: 40px; background: #f8fafc; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; max-width: 800px; }
  .card { background: white; border-radius: 16px; padding: 32px; border: 1px solid #e5e7eb; }
  .label { font-size: 11px; color: #94a3b8; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 20px; }
</style></head>
<body>
<div class="grid">

  <!-- Option 1 -->
  <div class="card">
    <div class="label">Option 1 — Gaussian peak</div>
    <svg width="180" height="60" viewBox="0 0 180 60" xmlns="http://www.w3.org/2000/svg">
      <rect width="48" height="48" y="6" rx="10" fill="#0f172a"/>
      <line x1="8" y1="46" x2="40" y2="46" stroke="#1e3a5f" stroke-width="1"/>
      <path d="M8,46 C12,46 16,44 20,34 C22,28 24,22 24,18 C24,22 26,28 28,36 C32,44 36,46 40,46"
        fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
      <text x="58" y="28" font-size="20" fill="#0f172a" font-weight="700" font-family="system-ui">Metabo</text>
      <text x="58" y="50" font-size="20" fill="#3b82f6" font-weight="700" font-family="system-ui">LC</text>
    </svg>
  </div>

  <!-- Option 2 -->
  <div class="card">
    <div class="label">Option 2 — M as chromatogram</div>
    <svg width="180" height="60" viewBox="0 0 180 60" xmlns="http://www.w3.org/2000/svg">
      <rect width="48" height="48" y="6" rx="10" fill="#1e40af"/>
      <polyline points="10,46 18,46 22,26 28,14 34,26 38,46 46,46"
        fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="58" y="36" font-size="24" fill="#0f172a" font-weight="800" font-family="system-ui" letter-spacing="-1">MetaboLC</text>
      <text x="59" y="52" font-size="10" fill="#6366f1" font-family="system-ui" font-weight="600" letter-spacing="3">REPOSITORY</text>
    </svg>
  </div>

  <!-- Option 3 -->
  <div class="card">
    <div class="label">Option 3 — Circle indigo</div>
    <svg width="180" height="60" viewBox="0 0 180 60" xmlns="http://www.w3.org/2000/svg">
      <circle cx="28" cy="30" r="24" fill="#6366f1"/>
      <path d="M10,38 C14,38 18,36 22,24 C24,18 26,12 28,10 C30,12 32,18 36,28 C38,34 42,38 46,38"
        fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
      <text x="62" y="26" font-size="20" fill="#0f172a" font-weight="700" font-family="system-ui">MetaboLC</text>
      <text x="62" y="44" font-size="10" fill="#94a3b8" font-family="system-ui">LC-MS/MS Repository</text>
    </svg>
  </div>

  <!-- Option 4 -->
  <div class="card" style="background:#0f172a">
    <div class="label" style="color:#475569">Option 4 — Dark pill</div>
    <svg width="200" height="56" viewBox="0 0 200 56" xmlns="http://www.w3.org/2000/svg">
      <rect width="200" height="56" rx="12" fill="#1e293b"/>
      <line x1="12" y1="42" x2="72" y2="42" stroke="#334155" stroke-width="1"/>
      <path d="M12,42 C16,42 18,40 20,32 C22,24 24,18 26,14 C28,18 30,26 32,36 C34,40 36,42 38,42"
        fill="none" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M38,42 C40,42 42,40 44,32 C46,22 48,16 52,12 C56,16 58,24 60,34 C62,40 64,42 66,42"
        fill="none" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round"/>
      <text x="82" y="28" font-size="18" fill="white" font-weight="700" font-family="system-ui">Metabo</text>
      <text x="82" y="46" font-size="13" fill="#60a5fa" font-family="monospace" font-weight="600" letter-spacing="1">LC · MS/MS</text>
    </svg>
  </div>

</div>
</body>
</html>
